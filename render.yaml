services:
  - type: web
    name: skillacademy-backend
    runtime: node
    plan: free
    rootDir: backend-fastify
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        value: https://skillacademy-elasticsearch.onrender.com

  - type: web
    name: skillacademy-elasticsearch
    runtime: docker
    plan: free
    dockerfilePath: backend-fastify/elasticsearch.Dockerfile
    envVars:
      - key: ES_JAVA_OPTS
        value: -Xms256m -Xmx256m
      - key: discovery.type
        value: single-node
      - key: xpack.security.enabled
        value: "false"
