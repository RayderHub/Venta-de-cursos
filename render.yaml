services:
  - type: web
    name: skillacademy-backend
    runtime: node
    plan: free
    rootDir: backend-fastify
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        value: http://localhost:9200
